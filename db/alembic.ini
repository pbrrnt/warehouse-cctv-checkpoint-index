[alembic]
script_location = migrations
prepend_sys_path = ..

# sqlalchemy.url is intentionally NOT set here. It is read from the
# DATABASE_URL environment variable instead (see migrations/env.py) so
# database credentials never end up committed in a config file.
#
# NOTE: keep this file ASCII-only. Alembic's config loader reads it using
# the OS locale encoding (not UTF-8) on some platforms, and non-ASCII
# bytes here will crash with UnicodeDecodeError on Thai-locale Windows.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
