# เสิร์ฟ static file ของหน้าเว็บ + proxy /api/ ไปหา search-api (service
# ชื่อ "api" ในเครือข่าย docker-compose เดียวกัน — ดู docker-compose.yml)
#
# ★ web/app.js เรียก path แบบ "/api/search/plates" ตรง ๆ แต่ services/api/app.py
# ประกาศ route เป็น "/search/plates" (ไม่มี /api นำหน้า) — proxy_pass ที่มี
# "/" ต่อท้ายด้านล่างนี้จะตัด prefix "/api/" ออกก่อนส่งต่อให้ตรงกับ route จริง
#
# ★ HTTPS ด้วย self-signed cert (ดู ADR-025, 06-pdpa-compliance.md หัวข้อ 7)
# — cert ไม่ได้ bake เข้า image (เป็นความลับ + ต่างกันทุกไซต์) mount ผ่าน
# volume ${DATA_ROOT}/certs:/etc/nginx/certs สร้างด้วย scripts/gen_selfsigned_cert.sh
# ก่อน docker compose up (ดู 09-multi-site-runbook.md)

# HTTP :80 — redirect ไป HTTPS อย่างเดียว ไม่เสิร์ฟเนื้อหา
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/web.crt;
    ssl_certificate_key /etc/nginx/certs/web.key;
    # โปรโตคอล/cipher สมัยใหม่เท่านั้น (LAN แต่ก็ไม่มีเหตุต้องรองรับของเก่า)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ★ ต้องส่ง X-Forwarded-Proto ให้ backend รู้ว่า client มาทาง https
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
