# ============================================================
#  Mosquitto — MQTT broker เชื่อม Frigate กับ indexer
#
#  ★ broker นี้ใช้ภายใน Docker network เท่านั้น
#    port ถูกผูกไว้กับเครื่องเพื่อ debug ไม่ได้เปิดสู่เครือข่ายภายนอก
# ============================================================

listener 1883
protocol mqtt

# อนุญาตแบบไม่ต้องยืนยันตัวตน เพราะอยู่ใน Docker network ปิด
# ★ ถ้าภายหลังต้องเปิด port นี้ออกนอกเครื่อง ต้องเปลี่ยนเป็น false
#   แล้วตั้ง password_file ด้วย
allow_anonymous true

# เก็บ message ที่ค้างไว้เมื่อ broker รีสตาร์ต
persistence true
persistence_location /mosquitto/data/

# log ออก stdout ให้ docker เก็บ (มี rotation อยู่แล้วใน compose)
log_dest stdout
log_type error
log_type warning
log_type notice

# ป้องกัน client ที่หลุดแล้วค้างคิวจนกินหน่วยความจำ
max_queued_messages 1000
